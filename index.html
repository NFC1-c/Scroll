<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.SLVR | القائمة الحصرية</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* القسم العلوي (الهيدر) المطابق لصورتك */
    .brand-header {
      text-align: center;
      padding-top: 5rem;
      padding-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-title {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #a0a0a0;
      margin-top: 1rem;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }

    /* زر المنيو البارز تحت العنوان */
    .main-menu-btn {
      background: #ffffff;
      color: #121212;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
      transition: transform 0.3s, background 0.3s;
    }

    .main-menu-btn:hover {
      background: #d1d1d1;
      transform: scale(1.05);
    }

    /* شبكة الصور */
    .-w {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 6rem 1rem;
      display: grid;
      gap: 1.5rem;
    }

    .-w figure {
      width: 100%;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .-w figure.show {
      opacity: 1;
      transform: translateY(0);
    }

    .-w figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .-w figure:hover img {
      transform: scale(1.05);
    }

    /* نافذة المنيو المنبثقة */
    .menu-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      padding: 1rem;
    }

    .menu-modal.active {
      opacity: 1;
      pointer-events: all;
    }

    .menu-content {
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2.5rem 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .menu-header h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #ffffff;
      border-bottom: 1px solid #333;
      padding-bottom: 1rem;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #2a2a2a;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .menu-item h4 {
      font-size: 1.1rem;
      color: #fff;
    }

    .menu-item p {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.3rem;
    }

    .menu-price {
      font-weight: bold;
      color: #fff;
    }

    @media (min-width: 768px) {
      .-w {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="brand-header">
    <h1 class="brand-title">.SLVR</h1>
    <p class="brand-subtitle">استكشف المجموعة الحصرية • SCROLL TO REVEAL</p>
    
    <!-- زر المنيو الرئيسي والواضح -->
    <button class="main-menu-btn" onclick="toggleMenu()">استعرض قائمة المنيو</button>
  </div>

  <div class="-w">
    <!-- الصور محملة مباشرة لتفادي مشكلة المربعات الفارغة -->
    <figure class="reveal-item">
      <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80" alt="Style 1">
    </figure>
    <figure class="reveal-item">
      <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80" alt="Style 2">
    </figure>
    <figure class="reveal-item">
      <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=800&q=80" alt="Style 3">
    </figure>
    <figure class="reveal-item">
      <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=80" alt="Style 4">
    </figure>
  </div>

  <!-- نافذة المنيو -->
  <div id="menuModal" class="menu-modal">
    <div class="menu-content">
      <button class="close-btn" onclick="toggleMenu()">×</button>
      
      <div class="menu-header">
        <h2>SLVR. MENU</h2>
      </div>

      <div class="menu-item">
        <div>
          <h4>اسبريسو (Espresso)</h4>
          <p>مزيج SLVR الخاص</p>
        </div>
        <span class="menu-price">14 SAR</span>
      </div>

      <div class="menu-item">
        <div>
          <h4>فلات وايت (Flat White)</h4>
          <p>إسبريسو مع حليب مبخر</p>
        </div>
        <span class="menu-price">18 SAR</span>
      </div>

      <div class="menu-item">
        <div>
          <h4>SLVR. Latte (سلوفر لاتيه)</h4>
          <p>المشروب البارد الخاص</p>
        </div>
        <span class="menu-price">24 SAR</span>
      </div>

      <div class="menu-item">
        <div>
          <h4>سلوفر كوكيز (SLVR Cookie)</h4>
          <p>كوكيز الشوكولاتة الساخن</p>
        </div>
        <span class="menu-price">16 SAR</span>
      </div>

    </div>
  </div>

  <script>
    // دالة فتح وإغلاق المنيو
    function toggleMenu() {
      const modal = document.getElementById('menuModal');
      modal.classList.toggle('active');
    }

    // كود بديل ومضمون لتأثير ظهور الصور عند التمرير 
    // يعمل دائماً حتى بدون استدعاء مكتبات خارجية
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal-item').forEach((el) => {
      observer.observe(el);
    });
  </script>

</body>
</html>
