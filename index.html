<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLVR. | المعرض الفاخر</title>
  <script src="https://unpkg.com/@fiddle-digital/string-tune@1.2.1/dist/index.js"></script>
  <style>
@property --progress {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

:root {
  --vh: 1vh;
  --vw: 1vw;
  --c-white: #ffffff;
  --c-black: #121212;
  --c-grey-dark: #1e1e1e;
  --c-grey-light: #2a2a2a;
  --c-silver: #e0e0e0;
  --c-accent: #c5a059; /* لمسة ذهبية خشبية فاخرة */

  --easing-function: cubic-bezier(0.86, 0, 0.31, 1);
  --easing-timing: 1.4s;

  --g-gap: 0.8rem;
  --g-margin: calc(var(--g-gap) * 2);

  --mm: 0.75rem;
  --m: 0.95rem;
  --p: 1.1rem;
  --h1: 3.8rem;
  --h0: 5.5rem;
  --large: max(6rem, 16vw);
}

@media (min-width: 1024px) {
  :root {
    --g-margin: calc(var(--g-gap) * 4);
  }
}

html, body, * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--c-black);
  color: var(--c-white);
}

body {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

/* شعار SLVR البارز */
.brand-header {
  grid-column: 1 / -1;
  text-align: center;
  padding-top: 4rem;
  padding-bottom: 2rem;
}

.brand-title {
  font-size: var(--large);
  font-weight: 900;
  letter-spacing: -2px;
  color: var(--c-white);
  text-transform: uppercase;
  line-height: 0.9;
  text-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.brand-subtitle {
  font-size: var(--m);
  letter-spacing: 4px;
  color: var(--c-silver);
  margin-top: 1rem;
  text-transform: uppercase;
  opacity: 0.8;
}

.-w {
  margin-left: var(--g-margin);
  margin-right: var(--g-margin);
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  align-items: start;
  column-gap: var(--g-gap);
  padding-bottom: var(--h0);
}

.-w figure {
  overflow: hidden;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background-color: var(--c-grey-dark);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.-w figure img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  scale: 1.3;
  opacity: 0;
  clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%);
  transition: filter 0.5s ease;
}

.-w figure.-inview img {
  scale: 1;
  opacity: 1;
  clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
  transition:
    scale var(--easing-timing) var(--easing-function),
    opacity var(--easing-timing) var(--easing-function),
    clip-path var(--easing-timing) var(--easing-function);
}

.-w figure:hover img {
  filter: brightness(1.1) contrast(1.05);
}

/* مواقع الصور في الشبكة */
.-w .image-1 { grid-row-start: 2; grid-column: 2 / 8; height: 450px; }
.-w .image-2 { grid-row-start: 2; grid-column: 9 / 14; height: 380px; }
.-w .image-3 { grid-row-start: 3; grid-column: 3 / 8; height: 500px; margin-top: 2rem; }
.-w .image-4 { grid-row-start: 3; grid-column: 9 / 13; height: 420px; margin-top: 4rem; }
.-w .image-5 { grid-row-start: 4; grid-column: 2 / 7; height: 400px; margin-top: 2rem; }
.-w .image-6 { grid-row-start: 4; grid-column: 8 / 14; height: 480px; margin-top: 1rem; }

@media (max-width: 768px) {
  .-w { display: flex; flex-direction: column; gap: 2rem; }
  .-w figure { width: 100% !important; height: 300px !important; margin: 0 !important; }
}
</style>
</head>

<body>
  <div class="-w">
    <div class="brand-header">
      <h1 class="brand-title">SLVR.</h1>
      <p class="brand-subtitle">استكشف المجموعة الحصرية • SCROLL TO REVEAL</p>
    </div>

    <!-- صور فاخرة تتوافق مع هوية SLVR -->
    <figure class="image-1" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 1">
    </figure>
    
    <figure class="image-2" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 2">
    </figure>
    
    <figure class="image-3" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 3">
    </figure>
    
    <figure class="image-4" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 4">
    </figure>
    
    <figure class="image-5" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 5">
    </figure>
    
    <figure class="image-6" string string-repeat>
      <img string="lazy" string-lazy="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1000&q=80" alt="SLVR Collection 6">
    </figure>
  </div>

  <script>
    const stringTune = StringTune.StringTune.getInstance();
    window.StringTuneContext = stringTune;
    stringTune.use(StringTune.StringLazy);
    stringTune.start(0);
  </script>
</body>

</html>
